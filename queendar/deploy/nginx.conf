server {
  listen 3011;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container-local health (host nginx proxies /api/* to owner-auth :3019)
  location = /api/health {
    default_type application/json;
    return 200 '{"ok":true,"app":"queendar-safety"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
