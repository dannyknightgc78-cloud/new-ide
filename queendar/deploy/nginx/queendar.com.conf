# queendar.com — QueenDar portal :3011 on clouditmain.
# Origin HTTPS, DNS-only A. Do NOT orange-cloud (LaLiga/CF IP blocks in Spain).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name queendar.com;

    ssl_certificate /etc/letsencrypt/live/queendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queendar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 32m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        client_max_body_size 12m;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.queendar.com;

    ssl_certificate /etc/letsencrypt/live/queendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queendar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://queendar.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name queendar.com www.queendar.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://queendar.com$request_uri;
    }
}
